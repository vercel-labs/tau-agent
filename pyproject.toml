[project]
name = "tau-agent"
version = "0.1.0"
description = "Tau — a coding-agent chat bot demo built with the ai library and Textual"
requires-python = ">=3.12"
dependencies = [
    "ai[anthropic,openai]>=0.8.0",
    "textual>=3.0",
]

[project.scripts]
tau = "tau.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tau"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "mypy~=2.1.0",
    "poethepoet>=0.30",
    "ruff>=0.15.12",
]

[tool.poe.tasks]
format-check = "ruff format --check"
format = "ruff format"
lint = "ruff check ."
lint-fix = "ruff check --fix ."
type = "mypy tau"
check = ["format-check", "lint", "type"]
fix = ["lint-fix", "format"]
smoke = "python tests/smoke_fizzbuzz.py"
smoke-faults = "python tests/smoke_faults.py"
